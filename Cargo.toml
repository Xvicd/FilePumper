[package]
name = "file-pumper"
version = "0.5.1"
edition = "2021"
rust-version = "1.89"
description = "Inflate files to any size and embed/extract a payload inside PNG, JPEG, GIF, WebP or SVG (GUI + CLI)"
authors = ["idris Gindullin"]
license = "MIT"
readme = "README.md"
keywords = ["steganography", "payload", "inflate", "image", "cli"]
categories = ["command-line-utilities", "multimedia::images"]
repository = "https://github.com/Xvicd/FilePumper"
default-run = "file-pumper"

[lib]
name = "file_pumper"
path = "src/lib.rs"

[[bin]]
name = "file-pumper"
path = "src/main.rs"

# Консольная версия для командной строки (у графической сборки на Windows нет консоли).
[[bin]]
name = "file-pumper-cli"
path = "src/bin/cli.rs"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
crc32fast = "1.4"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "persistence"] }
flate2 = "1.1"
gif = "0.13"
getrandom = "0.2"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
rand = "0.8"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3.13"
zip = { version = "2.2", default-features = false, features = ["deflate"] }