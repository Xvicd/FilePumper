name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Версия из Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.read.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Версия: $version"

  build:
    name: Сборка (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Установить Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш Cargo
        uses: Swatinem/rust-cache@v2

      # Linux собирается через zig, чтобы бинарник требовал только glibc 2.17.
      - name: Установить zig
        if: runner.os == 'Linux'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Установить cargo-zigbuild
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo install cargo-zigbuild --locked

      - name: Сборка (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --bins

      - name: Сборка (Linux)
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.17 --bins

      - name: Упаковать (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.value }}"
          New-Item -ItemType Directory -Force dist\windows | Out-Null
          Copy-Item target\release\file-pumper.exe     dist\windows\FilePumper.exe
          Copy-Item target\release\file-pumper-cli.exe dist\windows\FilePumper-cli.exe
          Copy-Item dist\README.txt                             dist\windows\README.txt
          Compress-Archive -Path dist\windows\* -DestinationPath "FilePumper-$v-windows-x64.zip" -Force

      - name: Упаковать (Linux)
        if: runner.os == 'Linux'
        run: |
          v="${{ needs.version.outputs.value }}"
          mkdir -p dist/linux
          cp target/x86_64-unknown-linux-gnu/release/file-pumper \
             target/x86_64-unknown-linux-gnu/release/file-pumper-cli dist/linux/
          cp dist/README.txt dist/linux/README.txt
          chmod +x dist/linux/file-pumper dist/linux/file-pumper-cli
          # -C dist: внутри архива пути linux/..., как в README.
          tar -czf "FilePumper-$v-linux-x64.tar.gz" -C dist linux
          tar -tzvf "FilePumper-$v-linux-x64.tar.gz"
          ./dist/linux/file-pumper-cli --version

      - uses: actions/upload-artifact@v4
        with:
          name: FilePumper-${{ needs.version.outputs.value }}-${{ matrix.platform }}
          path: |
            FilePumper-*.zip
            FilePumper-*.tar.gz
          if-no-files-found: error

  publish:
    name: Публикация релиза
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # gh ищет git-репозиторий, поэтому репозиторий задаём явно —
    # тогда checkout в этом job'е не нужен.
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Релиз может уже существовать (например, собран и загружен локально),
      # поэтому создаём его только при отсутствии и всегда перезаливаем файлы.
      - name: Создать или обновить релиз на GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "FilePumper $GITHUB_REF_NAME" \
              --generate-notes
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber

      # Тело релиза берётся из docs/release-notes/<тег>.md: в заметках стоят
      # плейсхолдеры {{WIN_SHA}} и {{LINUX_SHA}}, здесь они заменяются на реальные
      # SHA-256 залитых архивов, чтобы описание всегда совпадало с файлами.
      # Нет заметок — остаётся автоматическое описание от gh.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/release-notes
          sparse-checkout-cone-mode: false

      - name: Тело релиза из заметок версии
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          if [ ! -f "$notes" ]; then
            echo "Заметок нет ($notes) — остаётся автоматическое описание"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          win="artifacts/FilePumper-$version-windows-x64.zip"
          linux="artifacts/FilePumper-$version-linux-x64.tar.gz"
          for file in "$win" "$linux"; do
            [ -f "$file" ] || { echo "Нет архива $file"; exit 1; }
          done
          win_sha=$(sha256sum "$win" | awk '{print $1}')
          linux_sha=$(sha256sum "$linux" | awk '{print $1}')
          echo "$win_sha  $(basename "$win")"
          echo "$linux_sha  $(basename "$linux")"
          sed -e "s/{{WIN_SHA}}/$win_sha/" -e "s/{{LINUX_SHA}}/$linux_sha/" "$notes" > body.md
          gh release edit "$GITHUB_REF_NAME" --notes-file body.md
